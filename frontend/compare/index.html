<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Strategies — RAVI VAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  body { padding-bottom: 60px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .page-title { font-size: 20px; font-weight: 700; margin: 28px 0 4px; }
  .page-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; max-width: 640px; line-height: 1.6; }

  .picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    font-size: 13px; cursor: pointer; user-select: none; color: var(--text-dim);
  }
  .chip input { display: none; }
  .chip .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); }
  .chip.selected { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }
  .chip.selected .swatch { background: var(--chip-color, var(--accent)); }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 60px 0; text-align: center; }

  .chart-card { margin-bottom: 24px; }
  .chart-card .card-pad { padding: 16px 20px 20px; }
  .legend-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; }
  .legend-row span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); }
  .legend-row .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

  .metrics-table td.strategy-col { font-weight: 600; }
  .metrics-table .row-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

  .heatmap-block { margin-bottom: 20px; }
  .heatmap-title { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .heatmap-title .swatch { width: 9px; height: 9px; border-radius: 50%; }
  .heatmap-grid { display: grid; grid-template-columns: 44px repeat(12, 1fr); gap: 3px; font-size: 10px; }
  .heatmap-grid .hdr { color: var(--text-muted); text-align: center; padding: 3px 0; }
  .heatmap-grid .yr { color: var(--text-muted); display: flex; align-items: center; font-family: var(--font-mono); }
  .heatmap-cell {
    text-align: center; padding: 5px 2px; border-radius: 3px; font-family: var(--font-mono); font-size: 10px;
    color: var(--text); background: var(--surface-2);
  }
  .heatmap-cell.empty { background: transparent; color: transparent; }

  .hist-bars { display: flex; align-items: flex-end; gap: 1px; height: 90px; margin-top: 8px; }
  .hist-bar { flex: 1; border-radius: 1px 1px 0 0; min-height: 1px; }
  .hist-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-mono); }

  .expectancy-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .loading { color: var(--text-muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand">RAVI VAM<span class="brand-dot">.</span></span>
      <div class="nav-links">
        <a class="nav-link" href="/">Strategies</a>
        <a class="nav-link active" href="/compare/">Compare</a>
        <a class="nav-link" href="/optimize/">Optimization</a>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="page-title">Compare Strategies</div>
    <div class="page-sub">Pick two or more strategies to see them side by side: equity curves over their own history, headline metrics, monthly returns, and the shape of their daily returns. Each strategy runs with its own default settings.</div>

    <div class="picker" id="picker"><div class="loading">Loading strategies&hellip;</div></div>
    <div id="content"></div>
  </div>

<script>
const API_BASE = window.__RAVI_API_BASE || '';
const PALETTE = ['#4c7dff', '#1fad5c', '#c99a2e', '#dc4646', '#a855f7', '#22b8cf'];

// Which daily_log "state" values mean "not holding a directional position"
// for this strategy -- used to reconstruct discrete investment episodes for
// the expectancy stat (a strategy that continuously rebalances doesn't have
// natural round-trip trades the way a single buy/sell pair does; the
// stretch between leaving cash and returning to it is the closest honest
// analogue). Strategies not listed here (the overlays, which are about
// entering/exiting a hedge rather than being invested or not) skip this
// stat rather than show a misleading number.
const CASH_LIKE_STATES = {
  step1_upro_4state: ['CASH'],
  step2_upro_tqqq_6state: ['CASH'],
};

let cache = {}; // strategy_id -> {config, result}
let selected = new Set();

async function fetchStrategies() {
  const resp = await fetch(API_BASE + '/api/strategies');
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

async function fetchBacktest(strategyId) {
  const resp = await fetch(API_BASE + '/api/backtest', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ strategy_id: strategyId, params: {}, initial_capital: 100000 }),
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

function renderPicker(strategies) {
  const el = document.getElementById('picker');
  const ids = Object.keys(strategies);
  el.innerHTML = ids.map((id, i) => `
    <label class="chip" data-id="${id}" style="--chip-color:${PALETTE[i % PALETTE.length]}">
      <input type="checkbox" value="${id}">
      <span class="swatch"></span>
      ${strategies[id].name}
    </label>`).join('');

  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.preventDefault();
      const id = chip.dataset.id;
      if (selected.has(id)) { selected.delete(id); chip.classList.remove('selected'); }
      else { selected.add(id); chip.classList.add('selected'); }
      renderComparison(strategies);
    });
  });
}

function colorFor(id, strategies) {
  const ids = Object.keys(strategies);
  return PALETTE[ids.indexOf(id) % PALETTE.length];
}

function dailyReturns(dailyLog) {
  const rets = [];
  for (let i = 1; i < dailyLog.length; i++) {
    const prev = dailyLog[i - 1].portfolio_value, cur = dailyLog[i].portfolio_value;
    if (prev > 0) rets.push((cur - prev) / prev);
  }
  return rets;
}

function monthlyReturnsByYear(dailyLog) {
  const byMonth = {}; // "YYYY-MM" -> {first, last}
  for (const row of dailyLog) {
    const ym = row.date.slice(0, 7);
    if (!byMonth[ym]) byMonth[ym] = { first: row.portfolio_value, last: row.portfolio_value };
    byMonth[ym].last = row.portfolio_value;
  }
  const byYear = {};
  for (const [ym, v] of Object.entries(byMonth)) {
    const [yr, mo] = ym.split('-');
    if (!byYear[yr]) byYear[yr] = Array(12).fill(null);
    byYear[yr][parseInt(mo, 10) - 1] = v.first > 0 ? ((v.last / v.first - 1) * 100) : null;
  }
  return byYear;
}

function computeExpectancy(dailyLog, strategyId) {
  const cashStates = CASH_LIKE_STATES[strategyId];
  if (!cashStates) return null;
  const episodes = [];
  let epStart = null;
  for (const row of dailyLog) {
    const inCash = cashStates.includes(row.state);
    if (!inCash && epStart === null) {
      epStart = row.portfolio_value;
    } else if (inCash && epStart !== null) {
      episodes.push((row.portfolio_value - epStart) / epStart);
      epStart = null;
    }
  }
  if (episodes.length === 0) return null;
  const wins = episodes.filter(e => e > 0), losses = episodes.filter(e => e <= 0);
  const winRate = wins.length / episodes.length;
  const avgWin = wins.length ? wins.reduce((a, b) => a + b, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;
  const expectancy = winRate * avgWin + (1 - winRate) * avgLoss;
  return { episodes: episodes.length, winRate, avgWin, avgLoss, expectancy };
}

function renderEquityOverlay(containerId, entries) {
  const el = document.getElementById(containerId);
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: 320,
    layout: { background: { color: 'transparent' }, textColor: '#9098a3' },
    grid: { vertLines: { color: '#1c1f25' }, horzLines: { color: '#1c1f25' } },
    timeScale: { borderColor: '#24272e' }, rightPriceScale: { borderColor: '#24272e' },
  });
  entries.forEach(({ id, label, dailyLog, color }) => {
    const series = chart.addLineSeries({ color, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, title: label });
    series.setData(dailyLog.map(row => ({ time: row.date, value: row.cumulative_return_pct })));
  });
  chart.timeScale().fitContent();
  window.addEventListener('resize', () => chart.applyOptions({ width: el.clientWidth }));
}

function renderHistogram(containerId, returns, color) {
  const el = document.getElementById(containerId);
  if (!returns.length) { el.innerHTML = ''; return; }
  const pctReturns = returns.map(r => r * 100);
  const min = Math.min(...pctReturns), max = Math.max(...pctReturns);
  const nBins = 28;
  const width = (max - min) / nBins || 1;
  const bins = Array(nBins).fill(0);
  pctReturns.forEach(r => {
    let idx = Math.floor((r - min) / width);
    if (idx >= nBins) idx = nBins - 1;
    if (idx < 0) idx = 0;
    bins[idx]++;
  });
  const maxCount = Math.max(...bins);
  el.innerHTML = `<div class="hist-bars">${bins.map(c => `<div class="hist-bar" style="height:${Math.max(2, c / maxCount * 90)}px; background:${color};opacity:0.75;"></div>`).join('')}</div>
    <div class="hist-axis"><span>${min.toFixed(1)}%</span><span>0%</span><span>${max.toFixed(1)}%</span></div>`;
}

function renderHeatmap(byYear, color) {
  const months = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const years = Object.keys(byYear).sort();
  let html = `<div class="heatmap-grid"><div></div>${months.map(m => `<div class="hdr">${m}</div>`).join('')}`;
  for (const yr of years) {
    html += `<div class="yr">${yr}</div>`;
    for (const v of byYear[yr]) {
      if (v === null) { html += `<div class="heatmap-cell empty">&middot;</div>`; continue; }
      const alpha = Math.min(0.85, Math.abs(v) / 15 + 0.15);
      const bg = v >= 0 ? `rgba(31,173,92,${alpha})` : `rgba(220,70,70,${alpha})`;
      html += `<div class="heatmap-cell" style="background:${bg};">${v >= 0 ? '+' : ''}${v.toFixed(1)}</div>`;
    }
  }
  html += `</div>`;
  return html;
}

function fmtMetric(v, digits, suffix = '') {
  if (v === undefined || v === null) return '&mdash;';
  return v.toFixed(digits) + suffix;
}

async function renderComparison(strategies) {
  const content = document.getElementById('content');
  if (selected.size < 2) {
    content.innerHTML = `<div class="empty-state">Select at least two strategies above to compare them.</div>`;
    return;
  }
  content.innerHTML = `<div class="loading">Running backtests&hellip;</div>`;

  const entries = [];
  for (const id of selected) {
    if (!cache[id]) {
      const result = await fetchBacktest(id);
      cache[id] = result;
    }
    entries.push({
      id, label: strategies[id].name, color: colorFor(id, strategies),
      dailyLog: cache[id].daily_log, metrics: cache[id].metrics,
    });
  }

  let html = '';

  // Equity overlay
  html += `<div class="card chart-card"><div class="card-pad">
    <div class="section-label">Cumulative return, each strategy over its own history</div>
    <div class="legend-row">${entries.map(e => `<span><span class="swatch" style="background:${e.color}"></span>${e.label}</span>`).join('')}</div>
    <div id="chart-overlay"></div>
  </div></div>`;

  // Metrics table
  html += `<div class="card card-pad" style="margin-bottom:24px;">
    <div class="section-label">Headline metrics</div>
    <table class="metrics-table">
      <thead><tr><th>Strategy</th><th>CAGR</th><th>Sharpe</th><th>Calmar</th><th>Max Drawdown</th><th>Trades</th></tr></thead>
      <tbody>${entries.map(e => `
        <tr>
          <td class="strategy-col"><span style="color:${e.color};">&#9679;</span> ${e.label}</td>
          <td class="num">${fmtMetric(e.metrics.cagr_pct, 1, '%')}</td>
          <td class="num">${fmtMetric(e.metrics.sharpe, 2)}</td>
          <td class="num">${fmtMetric(e.metrics.calmar, 3)}</td>
          <td class="num neg">${fmtMetric(e.metrics.max_drawdown_pct, 1, '%')}</td>
          <td class="num">${e.metrics.total_trades ?? '&mdash;'}</td>
        </tr>`).join('')}</tbody>
    </table>
  </div>`;

  // Expectancy
  const expectancyEntries = entries.map(e => ({ ...e, exp: computeExpectancy(e.dailyLog, e.id) })).filter(e => e.exp);
  if (expectancyEntries.length) {
    html += `<div class="card card-pad" style="margin-bottom:24px;">
      <div class="section-label">Expectancy per investment cycle (cash &rarr; invested &rarr; back to cash)</div>
      <div class="expectancy-row">${expectancyEntries.map(e => `
        <div class="stat">
          <div class="stat-label" style="color:${e.color};">${e.label}</div>
          <div class="stat-value ${e.exp.expectancy >= 0 ? 'pos' : 'neg'}">${e.exp.expectancy >= 0 ? '+' : ''}${(e.exp.expectancy * 100).toFixed(2)}%</div>
          <div class="stat-sub">${e.exp.episodes} cycles &middot; ${(e.exp.winRate * 100).toFixed(0)}% win &middot; avg win ${(e.exp.avgWin * 100).toFixed(1)}% &middot; avg loss ${(e.exp.avgLoss * 100).toFixed(1)}%</div>
        </div>`).join('')}</div>
      <div class="stat-sub" style="margin-top:12px;">Not shown for overlay strategies (SPXU/SVIX) &mdash; they hedge an existing position rather than being invested or not, so this cycle definition doesn't apply cleanly.</div>
    </div>`;
  }

  // Returns distribution
  html += `<div class="grid-2">${entries.map((e, i) => `
    <div class="card card-pad">
      <div class="section-label" style="color:${e.color};">${e.label} &mdash; daily return distribution</div>
      <div id="hist-${i}"></div>
    </div>`).join('')}</div>`;

  // Monthly heatmaps
  html += `<div class="card card-pad">
    <div class="section-label">Monthly returns</div>
    ${entries.map(e => `
      <div class="heatmap-block">
        <div class="heatmap-title"><span class="swatch" style="background:${e.color};"></span>${e.label}</div>
        ${renderHeatmap(monthlyReturnsByYear(e.dailyLog), e.color)}
      </div>`).join('')}
  </div>`;

  content.innerHTML = html;
  renderEquityOverlay('chart-overlay', entries);
  entries.forEach((e, i) => renderHistogram(`hist-${i}`, dailyReturns(e.dailyLog), e.color));
}

async function main() {
  try {
    const strategies = await fetchStrategies();
    renderPicker(strategies);
    document.getElementById('content').innerHTML = `<div class="empty-state">Select at least two strategies above to compare them.</div>`;
  } catch (err) {
    document.getElementById('picker').innerHTML = `<div class="loading">Couldn't load strategies: ${err.message}</div>`;
  }
}
main();
</script>
</body>
</html>
