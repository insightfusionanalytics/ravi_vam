# Reference copy of the LIVE nginx config for backtestravi.insightfusionanalytics.com.
#
# This mirrors what's actually deployed at
# /etc/nginx/sites-available/backtestravi.insightfusionanalytics.com on the
# server — a config that already existed (SSL cert and all) from an earlier
# setup, before this repo's own bootstrap-then-Certbot flow (README §3.4) was
# ever run against this domain. There is no separate "bootstrap → certbot
# rewrites it" step for this file the way §3.4 describes for a brand new
# domain — this one was already complete. Keep this file in sync manually if
# you hand-edit the live one.
#
# Disaster recovery: if the live file is ever lost, restore THIS file.
# Confirm the ssl_certificate paths still exist on disk first — if not,
# re-run: sudo certbot --nginx -d backtestravi.insightfusionanalytics.com
#
# One backend, one location block: this app is a single FastAPI process
# serving the JSON API (/api/*), its own docs (/docs, /redoc, /openapi.json),
# AND the static frontend (/, /dashboard/*) — so a single catch-all
# `location /` proxying everything to the app is correct and sufficient.
# FastAPI routes /api and /docs internally; nginx doesn't need to split them
# out to handle them correctly.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backtestravi.insightfusionanalytics.com;
    ssl_certificate /etc/letsencrypt/live/backtestravi.insightfusionanalytics.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backtestravi.insightfusionanalytics.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass         http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Generous timeout — a full backtest or (once added) an Optuna
        # optimization run can take well over nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name backtestravi.insightfusionanalytics.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
