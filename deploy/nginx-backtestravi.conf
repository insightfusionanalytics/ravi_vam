# Reference copy of the LIVE, post-Certbot config for backtestravi.insightfusionanalytics.com.
#
# This is what /etc/nginx/sites-available/backtestravi looks like *after*
# `certbot --nginx -d backtestravi.insightfusionanalytics.com` has run once
# (see README §3.3). Keep this file in sync manually if you ever hand-edit
# the live one (e.g. to add a www alias) — Certbot only touches its own
# `# managed by Certbot` lines when you re-run it.
#
# Disaster recovery: if /etc/nginx/sites-available/backtestravi is ever lost,
# restore THIS file (not the bootstrap one) — it already has the SSL block
# and the /api + /docs routing below. Just confirm the ssl_certificate paths
# still exist on disk; if not, re-run certbot --nginx to reissue and re-link.
#
# There is only one backend here (unlike a split frontend/API setup) — the
# FastAPI app itself serves the JSON API (/api/*), its own interactive docs
# (/docs, /redoc, /openapi.json), AND the static frontend (/, /dashboard/*)
# from one process. So every location below proxies to the same upstream,
# unchanged — there is no path-stripping/rewriting to get wrong here. The
# blocks are still split out (instead of one bare `location /`) so each can
# carry its own timeout/comment, and so it's obvious in the logs which class
# of request is which.

upstream ravi_vam_backend {
    server 127.0.0.1:8010;
}

server {
    server_name backtestravi.insightfusionanalytics.com;

    # JSON API — backtest runs and (once added) Optuna optimization runs can
    # take well over nginx's default 60s, hence the longer read timeout.
    location /api/ {
        proxy_pass http://ravi_vam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # FastAPI's auto-generated interactive docs + OpenAPI schema.
    location = /docs {
        proxy_pass http://ravi_vam_backend;
        proxy_set_header Host $host;
    }
    location = /redoc {
        proxy_pass http://ravi_vam_backend;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://ravi_vam_backend;
        proxy_set_header Host $host;
    }

    # Everything else: the strategy selector page and /dashboard/* — static
    # HTML/JS served directly by the FastAPI app (StaticFiles mount), not a
    # separately built/deployed frontend.
    location / {
        proxy_pass http://ravi_vam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/backtestravi.insightfusionanalytics.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backtestravi.insightfusionanalytics.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = backtestravi.insightfusionanalytics.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name backtestravi.insightfusionanalytics.com;
    return 404; # managed by Certbot
}
