# Bootstrap config — HTTP only, no SSL directives at all.
#
# Install this FIRST, before running certbot. It has nothing in it that can
# fail to load (no `listen ... ssl`, no `ssl_certificate` path), so it's safe
# to reload nginx with this in place even though no certificate exists yet.
# Certbot's HTTP-01 validation also needs port 80 serving *something* for
# this domain, which this provides.
#
# Once certbot has issued a certificate (see README §3.3), it rewrites
# /etc/nginx/sites-available/backtestravi itself and the file will look like
# deploy/nginx-backtestravi.conf instead. Do not hand-edit in the SSL block —
# that part is Certbot's.

server {
    listen 80;
    listen [::]:80;
    server_name backtestravi.insightfusionanalytics.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
