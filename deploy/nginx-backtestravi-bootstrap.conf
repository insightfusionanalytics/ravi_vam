# Bootstrap config — HTTP only, no SSL directives at all.
#
# NOT currently the active config for this domain. backtestravi.insightfusion
# analytics.com already had a complete, working SSL setup from an earlier
# deployment (see deploy/nginx-backtestravi.conf, the actual live file) —
# this bootstrap file is kept as the generic starting point for setting up
# a *new* domain from scratch on this box, following README §3.4.
#
# Install this FIRST (for a genuinely new domain), before running certbot.
# It has nothing in it that can fail to load (no `listen ... ssl`, no
# `ssl_certificate` path), so it's safe to reload nginx with this in place
# even though no certificate exists yet. Certbot's HTTP-01 validation also
# needs port 80 serving *something* for the domain, which this provides.
#
# Once certbot has issued a certificate (see README §3.4), it rewrites this
# site's file in /etc/nginx/sites-available/ itself, adding the SSL block —
# do not hand-write that part.

server {
    listen 80;
    listen [::]:80;
    server_name backtestravi.insightfusionanalytics.com;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
